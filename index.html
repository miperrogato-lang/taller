    <div class="hincha-grid">
      ${lista.map(c=>`<button class="hincha-chip" data-hincha-club="${esc(c)}">${esc(c)}</button>`).join('')}
      ${afa?`<button class="hincha-chip otro" data-act="hincha-otro">✏️ Otro…</button>`:''}
      <button class="hincha-chip ninguno" data-act="hincha-ninguno">Ninguno</button>
    </div>
    ${afa?`<div id="hinchaOtroBox" style="display:none;margin-top:12px">
      <input id="hinchaOtroInp" class="field" placeholder="Escribí tu equipo" maxlength="40">
      <button class="btn" data-act="hincha-guardar-otro" style="margin-top:8px">Guardar</button>
    </div>`:''}`;
}
function vHinchada(){
  const t=torneoActual();
  const volver=`<button class="btn alt" data-act="cerrar-hinchada" style="margin-top:8px">← Volver</button>`;
  const titulo=t?('Hinchada · '+esc(t.nombre)):'Hinchada';
  const conteo={};let total=0;
  S.jugadores.forEach(j=>{const c=t&&hinchaDe(j,t.id);if(c&&c!==HINCHA_NINGUNO){conteo[c]=(conteo[c]||0)+1;total++;}});
  const filas=Object.entries(conteo).sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0]));
  const yo=jug(S.yo), miClub=t&&hinchaDe(yo,t.id);
  const botonMio=`<button class="btn ${miClub&&miClub!==HINCHA_NINGUNO?'alt':''}" data-act="hincha-abrir" style="margin-top:10px">${miClub&&miClub!==HINCHA_NINGUNO?'Cambiar mi club':'Elegir mi club'}</button>`;
  if(!total)return `<div class="eyebrow">Comunidad</div><div class="h1" style="margin-bottom:12px">👥 ${titulo}</div><div class="card"><p class="muted" style="margin:0">Todavía nadie eligió su club en esta liga. Cuando la gente responda, acá aparece el mapa de hinchas.</p></div>${botonMio}${volver}`;
  const max=filas[0][1];
  return `<div class="eyebrow">Comunidad · ${total} ${total===1?'hincha':'hinchas'}</div>
    <div class="h1" style="margin-bottom:12px">👥 ${titulo}</div>
    <div class="card">
      ${filas.map(([club,n])=>{const pct=Math.round(n/total*100);const mio=miClub===club;return `<div class="hb-row"><div class="hb-top"><span class="hb-club">${esc(club)}${mio?' <b>· vos</b>':''}</span><span class="hb-n">${n} · ${pct}%</span></div><div class="hb-bar"><div class="hb-fill${mio?' mio':''}" style="width:${Math.max(6,Math.round(n/max*100))}%"></div></div></div>`;}).join('')}
    </div>
    ${botonMio}
    ${volver}`;
}
// ===== 📊 TABLA DE POSICIONES + GOLEADORES del torneo real (Vernense), cargados a mano =====
function ligaEsVernense(t){return !!(t&&!t.conPlata);}          // solo en la liga gratis (Vernense)
// Puede editar tabla/goleadores: el organizador O el cargador (secretario con PIN).
function puedeEditarLiga(){return soyOrg()||S.rol==='cargador';}
// Torneo cuya tabla se ve/edita: el actual si es Vernense; si no, el primer torneo gratis (para el cargador).
function ligaTorneoActual(){const t=torneoActual();if(ligaEsVernense(t))return t;return (torneosActivos().find(x=>!x.conPlata))||((S.torneos||[]).find(x=>!x.conPlata))||t;}
function ligaData(tid){const d=S.ligaInfo[tid];return d&&typeof d==='object'?{tabla:d.tabla||[],gol:d.gol||[]}:{tabla:[],gol:[]};}
function ligaTablaSeed(){return CLUBES_VERNENSE.map(eq=>({eq,pts:'',pj:'',g:'',e:'',p:'',gf:'',gc:''}));}
// Lee los inputs de la pantalla de edición y los vuelca (borrador) a S.ligaInfo, sin guardar aún.
function _ligaLeerEdit(){
  const t=ligaTorneoActual();if(!t)return;
  const tabla=ligaTablaSeed();
  document.querySelectorAll('[data-lt]').forEach(inp=>{const [i,c]=inp.dataset.lt.split('|');const v=(inp.value||'').trim();if(tabla[+i])tabla[+i][c]=(v===''?'':(+v||0));});
  const golMap={};
  document.querySelectorAll('[data-lg]').forEach(inp=>{const [i,c]=inp.dataset.lg.split('|');golMap[i]=golMap[i]||{nom:'',eq:'',goles:''};golMap[i][c]=(c==='goles'?((inp.value||'').trim()===''?'':(+inp.value||0)):(inp.value||'').trim());});
  const gol=Object.keys(golMap).sort((a,b)=>+a-+b).map(k=>golMap[k]).filter(x=>x.nom&&x.nom.trim());
  S.ligaInfo[t.id]={tabla,gol};
}
function ligaCard(){
  const t=torneoActual();if(!ligaEsVernense(t))return '';
  const d=ligaData(t.id);const hay=(d.tabla||[]).some(x=>x.pts!==''&&x.pts!=null)||(d.gol||[]).some(x=>x.nom);

}
function vLiga(){
  const t=ligaTorneoActual();const puede=puedeEditarLiga();
  if(S.ligaEdit&&puede)return vLigaEdit();
  const volver=`<button class="btn alt" data-act="cerrar-liga" style="margin-top:8px">← Volver</button>`;

  const d=ligaData(t.id);
  const dg=x=>(+x.gf||0)-(+x.gc||0);
  const tabla=(d.tabla||[]).filter(x=>x.pts!==''&&x.pts!=null).slice()
    .sort((a,b)=>(+b.pts||0)-(+a.pts||0)||dg(b)-dg(a)||(+b.gf||0)-(+a.gf||0)||(a.eq||'').localeCompare(b.eq||''));
  const gol=(d.gol||[]).filter(x=>x.nom&&x.nom.trim()).slice()
    .sort((a,b)=>(+b.goles||0)-(+a.goles||0)).slice(0,10);
  const tablaHtml=tabla.length?`<div class="card" style="padding:10px 12px">
    <div class="lt-head"><span>#</span><span class="lt-eqh">Equipo</span><span>PJ</span><span>DG</span><span class="lt-ptsh">Pts</span></div>
    ${tabla.map((x,i)=>{const d2=dg(x);return `<div class="lt-row">
      <span class="lt-pos ${i<4?'top':''}">${i+1}</span>
      <span class="lt-mid"><span class="lt-eq">${esc(x.eq)}</span><span class="lt-sub">${x.g||0}-${x.e||0}-${x.p||0} · GF ${x.gf||0} · GC ${x.gc||0}</span></span>
      <span class="lt-pj">${x.pj||0}</span>
      <span class="lt-dg">${d2>0?'+':''}${d2}</span>
      <span class="lt-pts">${x.pts||0}</span>
    </div>`;}).join('')}
  </div>`:`<div class="card"><p class="muted" style="margin:0">La tabla todavía no está cargada.</p></div>`;
  const golHtml=gol.length?`<div class="lbl" style="margin:16px 2px 8px">⚽ Goleadores · Top 10</div><div class="card">
    ${gol.map((x,i)=>`<div class="lg-row"><span class="lg-pos ${i===0?'p1':''}">${i+1}</span><span class="lg-name">${esc(x.nom)}${x.eq?`<small> · ${esc(x.eq)}</small>`:''}</span><span class="lg-goles">${x.goles||0} <small>⚽</small></span></div>`).join('')}
  </div>`:'';
  return `<div class="eyebrow">${esc(t.nombre)} · torneo real</div>
    <div class="h1" style="margin-bottom:12px">📊 Tabla de posiciones</div>
    ${tablaHtml}
    ${golHtml}
    ${editBtn}
    ${volver}`;

  const byEq={};tabla.forEach(x=>byEq[x.eq]=x);
  tabla=CLUBES_VERNENSE.map(eq=>byEq[eq]||{eq,pts:'',pj:'',g:'',e:'',p:'',gf:'',gc:''});
  const nGol=Math.max((d.gol||[]).length+2, S._golRows||8);
  const gol=[];for(let i=0;i<nGol;i++)gol.push((d.gol||[])[i]||{nom:'',eq:'',goles:''});
  const campos=['pts','pj','g','e','p','gf','gc'];

  </div>`).join('');
  return `<div class="eyebrow">${esc(t.nombre)} · editar</div>
    <div class="h1" style="margin-bottom:6px">✏️ Cargar tabla</div>
    <p class="note" style="margin:0 0 12px">Cargá los números de cada equipo. Los puntos los ponés vos; la diferencia de gol se calcula sola al mostrar.</p>

}
// ===== 📱 NÚMEROS DE WHATSAPP (solo organizador): juntar contactos para armar el grupo =====
function wspNum(wsp){let d=(wsp||'').replace(/\D/g,'');if(!d)return '';if(d.startsWith('0'))d=d.slice(1);if(d.startsWith('54'))d=d.slice(2);if(d.startsWith('9'))d=d.slice(1);return '+549'+d;}
function wspParticipantes(){
  const t=ligaTorneoActual();
  const scope=S.wspScope||'jugaron';
  let ids;
  if(scope==='todos'){ ids=S.jugadores.filter(j=>j&&j.aprobado!==false&&!j.bloqueado).map(j=>j.id); }
  else{
    const vid=t&&t.id;
    const dist=new Set(VERNENSE_DISTINTIVOS.map(normEq));
    const esVer=f=>f.torneoId===vid || (f.partidos||[]).some(p=>dist.has(normEq(p.local))||dist.has(normEq(p.visitante)));
    const set=new Set();
    S.fechas.filter(esVer).forEach(f=>{(S.boletas[f.id]||[]).forEach(b=>set.add(b.jugadorId));});
    ids=[...set];
  }
  return ids.map(id=>{const j=jug(id);if(!j)return null;const num=wspNum(j.wsp);return num?{id,alias:j.alias||id,wsp:j.wsp,num}:null;})
    .filter(Boolean).sort((a,b)=>(a.alias||'').localeCompare(b.alias||'','es'));
}
// Cuántas fechas y boletas detecta como "de la Verense" (para el cartel diagnóstico)
function _wspDiag(){
  const t=ligaTorneoActual(); const vid=t&&t.id;
  const dist=new Set(VERNENSE_DISTINTIVOS.map(normEq));
  const esVer=f=>f.torneoId===vid || (f.partidos||[]).some(p=>dist.has(normEq(p.local))||dist.has(normEq(p.visitante)));
  const fs=S.fechas.filter(esVer);
  let bol=0; fs.forEach(f=>{bol+=(S.boletas[f.id]||[]).length;});
  return {fechas:fs.length,boletas:bol};
}
function _wspTxt(conNombre){return wspParticipantes().map(x=>conNombre?(x.alias+': '+x.num):x.num).join('\n');}
async function _copiarTexto(txt,msg){
  if(!txt){toast('No hay nada para copiar');return;}
  try{await navigator.clipboard.writeText(txt);toast(msg);return;}catch(e){}
  try{const ta=document.createElement('textarea');ta.value=txt;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();toast(msg);}catch(e){toast('No se pudo copiar');}
}

    ${grupo?`<a class="wsp-btn" href="${esc(grupo)}" target="_blank" rel="noopener" style="margin-top:12px">Abrir / compartir el grupo</a>`:`<p class="note" style="margin-top:12px">Tip: cargá el link de tu grupo en Config y aparece acá un botón para compartirlo.</p>`}
    ${volver}`;
}

/* ----- IDENTIDAD ----- */
function bannerInvitado(){
  // 🎉 Si entró por un link de invitación de un jugador válido, se lo damos la bienvenida.
  let invId=null; try{const g=lsGet('invitadoPor'); invId=g?g.value:null;}catch(e){}
  if(!invId)return '';
  const inv=S.jugadores.find(j=>j.id===invId);
  if(!inv)return '';
  return `<div class="card" style="background:linear-gradient(135deg,#0c3d24,#15803d);color:#fff;border:none;margin-bottom:14px;text-align:center">
    <div style="font-size:28px;line-height:1">🎉</div>
    <div style="font-family:'Archivo',sans-serif;font-weight:900;font-size:16px;margin:4px 0 2px">${esc(inv.alias)} te invitó al Prode CRC</div>
    <div style="background:#fff;color:#0c3d24;border-radius:10px;padding:8px 10px;margin-top:8px;font-weight:900;font-size:14px">🎁 Tu primera fecha es GRATIS</div>
    <p style="font-size:12.5px;color:#cde dd;margin:8px 0 0;color:#bfe6cf;line-height:1.4">Registrate y armá tu primera boleta sin costo. El organizador la confirma y jugás.</p>
  </div>`;
}
function renderIdentidad(){
  const r=S.reg,modo=r.modo||'elegir';
  const head=`<header><div class="brand"><div class="wordmark"><img class="hdlogo" src="${LOGO_URL}" alt="" onerror="this.style.display='none'"><div>PRODE<small>CRC · LIGA ARGENTINA</small></div></div></div><div class="hd-sub">Prode entre amigos · Grupo cerrado</div></header>`;
  let body='';
  if(modo==='elegir'){
    const postReset=(S.config&&S.config.pantallaCero)===true;
    if(postReset){
      body=`<div class="eyebrow">Bienvenido</div><div class="h1" style="margin-bottom:8px">Creá tu cuenta para jugar ⚽</div>
        <p class="muted" style="font-size:13.5px;line-height:1.5;margin:0 0 18px">Anotate en menos de un minuto y ya cargás tu boleta. ¡Gratis!</p>
        <button class="btn" data-act="cuenta-nueva" style="font-size:16px;padding:16px">⚽ Crear mi cuenta</button>
        <div class="card" style="margin-top:14px;background:var(--green-soft);border:1px solid var(--green)">
          <p class="note" style="margin:0;color:var(--ink-2);font-size:13px;line-height:1.55">👉 <b>¿Ya jugaste antes?</b> Hicimos un reinicio, así que <b>todos arrancamos con cuenta nueva</b>. Tu PIN viejo no va a funcionar — creá la tuya de nuevo, son 30 segundos.</p>
        </div>
        <button class="btn alt sm" data-act="modo-login" style="margin-top:18px">Ya hice mi cuenta nueva · Entrar</button>
        <button class="orglink" data-act="soy-organizador">⚙️ Soy el organizador</button>`;
    }else{
      body=`<div class="eyebrow">Bienvenido</div><div class="h1" style="margin-bottom:22px">Entrá al Prode</div>
        <button class="btn" data-act="modo-login" style="margin-bottom:11px">Ya tengo mi usuario</button>
        <button class="btn alt" data-act="modo-nuevo">Soy nuevo · anotarme</button>
        <button class="orglink" data-act="soy-organizador">⚙️ Soy el organizador</button>`;
    }
  }else if(modo==='login'){
    body=`<div class="eyebrow">Ingresá</div><div class="h1" style="margin-bottom:16px">Entrá con tu PIN</div>
      <input class="field" id="rAlias" placeholder="Tu nombre/apodo o tu celular" value="${esc(r.alias)}" autocomplete="off">
      <input class="field" id="rPin" inputmode="numeric" maxlength="4" placeholder="Tu PIN (4 números)" value="${esc(r.pin||'')}">
      <button class="btn" data-act="login" style="margin-top:16px">Entrar</button>
      <button class="btn alt sm" data-act="modo-volver" style="margin-top:8px">← Volver</button>
      <p class="smallnote">Podés entrar con tu nombre/apodo o con tu número de celular. Si te olvidaste el PIN, escribile al organizador para que te lo resetee.</p>`;
  }else{
    body=`
      <div class="eyebrow">Anotate</div><div class="h1" style="margin-bottom:16px">Creá tu usuario</div>
      <input class="field" id="rAlias" placeholder="Tu nombre o apodo" value="${esc(r.alias)}" autocomplete="off">
      <input class="field" id="rWsp" inputmode="tel" placeholder="WhatsApp sin 0 ni 15 (ej: 3482 654321)" value="${esc(r.wsp)}" autocomplete="off">
      <input class="field" id="rPin" inputmode="numeric" maxlength="4" placeholder="Creá un PIN de 4 números" value="${esc(r.pin||'')}">
      <div class="check ${r.ok?'on':''}" data-act="toggle-ok"><div class="box">${r.ok?'✓':''}</div><span>Entiendo que es un prode entre amigos con plata real: cargo mi pronóstico y transfiero la boleta. El organizador confirma el pago.</span></div>
      <button class="btn" data-act="registrar" style="margin-top:16px">Enviar solicitud</button>
      <button class="btn alt sm" data-act="modo-volver" style="margin-top:8px">← Volver</button>
      <p class="smallnote">Tu número tiene que ser el mismo que vas a tener en el grupo de WhatsApp del prode. El organizador revisa y te habilita. Anotá bien tu PIN: lo vas a necesitar cada vez que entres.</p>`;
  }
  app().innerHTML=head+`<div class="screen">${bannerInvitado()}${body}</div>`;
  const setReg=()=>{S.reg.alias=val('rAlias');S.reg.wsp=val('rWsp');S.reg.pin=val('rPin');};
  const a=(n,fn)=>{const e=document.querySelector(`[data-act="${n}"]`);if(e)e.onclick=fn;};
  a('modo-login',()=>{setReg();S.reg.modo='login';renderIdentidad();});
  a('modo-nuevo',()=>{setReg();S.reg.modo='nuevo';renderIdentidad();});
  a('modo-volver',()=>{S.reg.modo='elegir';renderIdentidad();});
  a('cuenta-nueva',()=>{lsSet('yo',null);lsSet('yoCache',null);S.recuperarId=null;S.necesitaCuentaNueva=false;S.reg={alias:'',wsp:'',pin:'',ok:false,modo:'nuevo'};renderIdentidad();});
  a('soy-organizador',()=>{S.adminGate=true;render();});
  a('toggle-ok',()=>{setReg();S.reg.ok=!S.reg.ok;renderIdentidad();});
  a('login',async()=>{
    const al=val('rAlias').trim(),pin=val('rPin').trim();
    if(!al||!pin){toast('Completá nombre/celular y PIN');return;}
    const dig=s=>(s||'').replace(/\D/g,'');
    const ex=S.jugadores.find(x=>x.alias.toLowerCase()===al.toLowerCase()||(dig(al).length>=6&&dig(x.wsp)===dig(al)));
    if(!ex){
      // RECUPERACIÓN AUTOMÁTICA: este teléfono tiene un código viejo y su boleta quedó suelta.
      // Reconstruimos la cuenta con ese código → la boleta vieja se re-engancha sola.
      if(S.recuperarId){
        const esNum=dig(al).length>=6;
        const nuevo={id:S.recuperarId,alias:al,wsp:esNum?al:'',pin,aprobado:true,bloqueado:false};
        S.jugadores.push(nuevo);
        try{await saveJug();}catch(e){S.jugadores=S.jugadores.filter(x=>x.id!==nuevo.id);toast('⚠️ El sistema está saturado, probá de nuevo en unos segundos.');return;}
        S.yo=S.recuperarId;S.recuperarId=null;lsSet('yoCache',JSON.stringify(nuevo));await sSet('yo',S.yo,false);
        toast('¡Listo! Recuperamos tu cuenta y tu boleta 🎉');render();return;
      }
      toast('No te encontré. ¿Sos nuevo? Anotate');return;
    }
    if(ex.bloqueado){toast('Tu usuario fue bloqueado por el organizador');return;}
    if((ex.pin||'')!==pin){toast('PIN incorrecto');return;}
    S.yo=ex.id;S.reg={alias:'',wsp:'',pin:'',ok:false,modo:'elegir'};lsSet('yoCache',JSON.stringify(ex));await sSet('yo',S.yo,false);render();
  });
  a('registrar',async()=>{
    if(S.config.registrosCerrados){toast('Las inscripciones están cerradas por ahora. Si ya tenés cuenta, entrá con tu PIN.');return;}
    const al=val('rAlias').trim(),w=val('rWsp').trim(),pin=val('rPin').trim();
    if(!al){toast('Poné tu nombre o apodo');return;}
    if(S.jugadores.find(x=>x.alias.toLowerCase()===al.toLowerCase())){toast('Ese nombre ya existe. Si es tuyo, entrá con tu PIN');return;}
    if(!w){toast('Falta tu WhatsApp');return;}
    if(pin.length<4){toast('El PIN tiene que ser de 4 números');return;}
    if(!S.reg.ok){toast('Confirmá que entendés cómo funciona');return;}
    const id=uid();const nuevo={id,alias:al,wsp:w,pin,aprobado:false,bloqueado:false};
    // 🎁 si entró por invitación, lo dejamos registrado (no da ningún beneficio al que invita)
    try{const g=lsGet('invitadoPor'); const inv=g?g.value:null; if(inv&&inv!==id&&S.jugadores.some(j=>j.id===inv)){nuevo.invitadoPor=inv;nuevo.invitadoTs=Date.now();}}catch(e){}
    S.jugadores.push(nuevo);
    try{await saveJug();}catch(e){S.jugadores=S.jugadores.filter(x=>x.id!==id);toast('⚠️ El sistema está saturado. Esperá unos segundos y volvé a tocar Enviar.');return;}
    S.yo=id;S.reg={alias:'',wsp:'',pin:'',ok:false,modo:'elegir'};lsSet('yoCache',JSON.stringify(nuevo));await sSet('yo',S.yo,false);render();
  });
}
const val=id=>{const e=document.getElementById(id);return e?e.value:'';};

/* ----- JUGAR ----- */
function vJugar(){
  const f=fechaActiva();
  if(!f)return `${instalarBanner()}${pizarraCard()}${grupoWspBtn()}${aviso90Card()}${empty('🗓️','Todavía no hay fecha','Pedile al organizador que arme la fecha con los partidos del finde.')}`;
  const est=efEstado(f),sc=scoreFecha(f),mb=miBoleta(f.id),cob=S.config.cobro||{},gratis=esGratis(),precio0=(+f.precio===0&&f.precio!=null);

  if(est==='abierta'){
    const allPicked=f.partidos.length>0&&Object.keys(S.misPicks).length===f.partidos.length;
    const editando=Object.keys(S.misPicks).length>0;
    return `
      ${instalarBanner()}
      ${pizarraCard()}
      ${invitarAmigoCard()}
      ${grupoWspBtn()}
      ${aviso90Card()}
      <div class="eyebrow">Fecha abierta · jugá ahora</div>
      <div class="h1" style="margin-bottom:12px">${esc(f.nombre)}</div>
      ${pozoCard()}
      ${f.cierre?`<div class="cd-big" id="cd"><div class="cd-label">⏱ CIERRA EN</div><div class="cd-nums" id="cdv">--:--:--</div><div class="cd-units">HS&nbsp;&nbsp;&nbsp;MIN&nbsp;&nbsp;&nbsp;SEG</div></div>`:''}
      ${(()=>{const n=boletasDe(f.id).length;return n>0?`<div class="boleta-count">🎟️ <b>${n}</b> ${n===1?'boleta jugando':'boletas jugando'} ${n>=5?'· ¡se está prendiendo! 🔥':''}</div>`:'<div class="boleta-count">🎟️ ¡Sé el primero en cargar tu boleta!</div>';})()}
      ${gratis
        ?`<div class="pozo"><div class="top"><div><div class="k">Torneo de práctica</div><div class="amt" style="font-size:24px">🎟️ Gratis</div></div></div>
        <p class="note2">Jugá para practicar y divertirte. Tiene ranking y aciertos, pero sin plata. Ideal para agarrarle la mano.</p></div>`
        :`<div class="pozo"><div class="top"><div><div class="k">${sinPremio(f)?'🎉 Por diversión':(f.premioPct?'🔥 Premio ahora (sube con cada boleta)':'Premio garantizado')}</div><div class="amt"${sinPremio(f)?' style="font-size:24px"':''}>${sinPremio(f)?'Sin premio en plata':(f.premioPct&&premioDe(f)===0?'¡Arranca con la 1ª boleta!':$(premioDe(f)))}</div></div>
        <div class="meta">Boleta<b>${precio0?'🎟️ GRATIS':$(f.precio||PRECIO_DEF)}</b></div></div>
        <p class="note2">${sinPremio(f)?'Jugamos por diversión 🎉 Tiene ranking y aciertos. El pozo grande va para el próximo torneo.':`${precio0?'¡Participás gratis! ':''}Se lo lleva quien más aciertos tenga. ${f.desempate?'Si empatan, desempata el que más se acerca al total de goles de la fecha 🎯.':'Si empatan, se reparte en partes iguales.'}`}</p></div>`}
      ${mb?boletaPropiaCard(mb,f,sc):''}
      ${mb?estadoPagoCard(mb,f,cob,gratis,precio0):''}
      ${bannerPremios(f)}
      ${mb?'':`<div class="divider">Marcá tu pronóstico</div>
      ${f.turbo?`<div class="turbo-box">
        <div class="turbo-h">🏎️ Turbo · obligatorio</div>
        <p class="turbo-note">Elegí <b>un partido</b> y ponele el turbo: si lo acertás, <b>vale 2 puntos</b> en vez de 1. Jugatela donde más confiés. Los turbos de todos <b>se hacen públicos al cerrar la fecha</b>.</p>
      </div>`:''}
      ${partidosAgrupados(f)}
      ${f.desempate?`<div class="desemp-box">

      <div class="meta">${rk.filas.length} jugando</div></div>
      ${fin&&sc.ganadores.length?`<div class="gan"><div><div class="k">${sc.ganadores.length>1?'Ganadores':'Ganador'} · ${sc.ganadores[0].ac} aciertos</div><div class="nm">👑 ${sc.ganadores.map(g=>esc(alias(g.b.jugadorId))).join(', ')}</div></div>${sinPremio(f)?'':`<div class="meta">c/u<b>${$(sc.premioCu)}</b></div>`}</div>`:''}</div>`}
    ${mb?boletaPropiaCard(mb,f,sc):'<div class="card muted" style="text-align:center">No cargaste boleta en esta fecha.</div>'}
    ${rk.filas.length?`<div class="card"><div class="rkhead"><div class="lbl">Posiciones ${fin?'finales':'en vivo'}</div>${fin?'':`<div class="live"><span class="dot"></span>${rk.def} de ${rk.total} definidos</div>`}</div>
      ${rk.filas.map((l,i)=>`<div class="rk-row ${l.b.jugadorId===S.yo?'me':''}"><div class="pos ${i===0?'p1':''}">${i===0?'★':i+1}</div><div class="rk-name">${esc(alias(l.b.jugadorId))}${l.b.jugadorId===S.yo?' <small>· vos</small>':''}</div><div class="rk-ac">${rk.turboOn?`${l.pts}<small>pts${l.turboOk?' 🏎️':''}</small>`:`${l.ac}<small>aciertos</small>`}</div></div>`).join('')}</div>`:''}
    ${f.partidos.some(m=>m.resultado)?resultadosCard(f):''}
    ${tendenciaCard(f)}
    ${todasBoletasCard(f)}
    ${invitarBtn()}`;
}
function rankingEnVivo(f){
  const def=f.partidos.filter(m=>m.resultado).length;
  const turboOn=!!f.turbo;
  // Ordena por PUNTOS (el turbo acertado vale 2), igual que el reglamento y la tabla del torneo.
  // Antes ordenaba solo por aciertos y el turbo "no aparecía" en la tabla en vivo.
  const filas=boletasDe(f.id).map(b=>{
    let ac=0,pts=0,turboOk=false;
    for(const p of f.partidos){
      if(p.resultado&&p.resultado!=='A'&&b.picks[p.id]===p.resultado){
        ac++;
        const conTurbo=turboOn&&b.turbo===p.id;
        pts+=conTurbo?2:1;
        if(conTurbo)turboOk=true;
      }
    }
    return{b,ac,pts,turboOk};
  }).sort((x,y)=>y.pts-x.pts||y.ac-x.ac||x.b.ts-y.b.ts);
  return{def,total:f.partidos.length,filas,turboOn};
}
function boletaPropiaCard(b,f,sc){
  const fin=f.estado==='finalizada',gratis=esGratis()||(+f.precio===0&&f.precio!=null);
  let ac=null;if(fin){const e=sc.lista.find(l=>l.b.id===b.id);ac=e?e.ac:0;}
  const gano=sc.ganadores.some(g=>g.b.id===b.id),est=efEstado(f);
  return `<div class="card ${gano?'win':''}">
    <div class="mi-h"><div class="lbl">Mi boleta${gano?' 👑':''}</div>${gratis?'<span class="pill ok">🎟️ práctica</span>':`<span class="pill ${b.pagada?'ok':'pend'}">${b.pagada?'✓ pago confirmado':'pago pendiente'}</span>`}</div>
    ${!gratis&&b.pagada&&b.pagadaTs?`<div class="recibo">✓ Pago confirmado por el organizador · ${new Date(b.pagadaTs).toLocaleString('es-AR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})}</div>`:''}
    ${fin?`<div class="muted" style="font-size:13px;margin-bottom:8px">Acertaste <b style="color:var(--ink)">${ac}</b> de ${f.partidos.length}${gano?(gratis?' · ¡ganaste! 🏆':` · ganaste ${$(sc.premioCu)}`):''}</div>`:''}
    ${f.partidos.map(m=>{const pk=b.picks[m.id];const an=m.resultado==='A';const ok=m.resultado&&!an&&pk===m.resultado;const bad=m.resultado&&!an&&pk!==m.resultado;
      return `<div class="rl"><div class="tt">${escudo(m.local)}<span>${esc(m.local)}</span> <span class="muted" style="font-size:11px">vs</span> ${escudo(m.visitante)}<span>${esc(m.visitante)}</span></div><span class="rbt ${ok?'ok':bad?'bad':''}">${an?'Anulado':pk?esc(pickTexto(m,pk)):'–'}</span></div>`;}).join('')}
    ${f.desempate?`<div class="desemp-tag">🎯 Tu desempate: ${b.desempate!=null?`<b>${b.desempate}</b> goles`:'—'}${fin&&sc.golR!=null?` · real: <b>${sc.golR}</b>`:''}</div>`:''}
    ${f.turbo&&b.turbo?(()=>{const tp=f.partidos.find(x=>x.id===b.turbo);return tp?`<div class="desemp-tag" style="background:#fff4e0;border-color:#f0c070;color:#8a4f06">🏎️ Tu turbo: <b>${esc(tp.local)} vs ${esc(tp.visitante)}</b> · vale doble</div>`:'';})():''}
    <div class="bsum">${gratis?'<b class="mt" style="font-size:14px;color:var(--ink-3)">🎟️ Gratis</b>':`<b class="mt">${$(f.precio||PRECIO_DEF)}</b>`}
      <button class="btn alt sm" data-down-bol="${b.id}" style="width:auto;padding:9px 16px;margin:0">⤓ Descargar mi boleta</button></div></div>`;
}
function resultadosCard(f){
  return `<div class="card"><div class="lbl" style="margin-bottom:8px">Resultados cargados</div>
    ${f.partidos.map(m=>`<div class="rl"><div class="tt">${escudo(m.local)}<span>${esc(m.local)}</span> <span class="muted" style="font-size:11px">vs</span> ${escudo(m.visitante)}<span>${esc(m.visitante)}</span></div><span class="rbt ${m.resultado&&m.resultado!=='A'?'ok':''}">${m.resultado==='A'?'Anulado':m.resultado?esc(pickTexto(m,m.resultado)):'–'}</span></div>`).join('')}</div>`;
}
function appLink(){const o=location.origin||'';return(o&&o.startsWith('http')&&!o.includes('null'))?o+location.pathname:'https://prode-t9iq.vercel.app';}
const DEFAULT_INVITA='⚽ ¡Te invito al Prode CRC! Pronosticá los partidos y ganá premios 🏆 Es gratis, sumate 👉';
function linkInvitacion(){
  // Link personal del jugador: identifica quién invita. Si no hay jugador, link normal.
  const base=appLink();
  if(S.yo){const sep=base.includes('?')?'&':'?';return base+sep+'invita='+encodeURIComponent(S.yo);}
  return base;
}
function textoInvitacion(){const t=(S.config.invitaTexto||'').trim()||DEFAULT_INVITA;return t+' '+linkInvitacion();}
// 🥊 Botón flotante de desafíos — llamativo, arriba del de invitar.
// Solo si están habilitados, hay jugador, y no es torneo gratis.
function fabDesafios(){
  if(!S.yo||esGratis()||!S.config.desafiosOn)return '';
  if(S.view==='admin'||S.vistaDuelo)return '';
  // avisos: desafíos pendientes que me mandaron
  const pend=S.desafios.filter(d=>d.paraId===S.yo&&d.estado==='pendiente').length;
  return `<button class="fab-duelo" data-act="ir-duelos" title="Desafíos" aria-label="Desafíos">🥊<span>Desafíos</span>${pend?`<b class="fab-badge">${pend}</b>`:''}</button>`;
}

function misDuelosResumen(mios){
  const activos=mios.filter(d=>d.estado==='aceptado'||d.estado==='pendiente');
  if(!activos.length)return '';
  return `<div class="duelo-lista">${activos.slice(0,6).map(d=>{
    const otroId=d.deId===S.yo?d.paraId:d.deId;
    const otro=jug(otroId);const e=estadoDesafio(d);
    let estado='';
    if(e.fase==='pendiente')estado=d.deId===S.yo?'⏳ esperando que acepte':'⏳ te toca responder';
    else if(e.fase==='en-juego')estado='🔴 en juego';
    else if(e.fase==='terminado')estado=e.ganador===S.yo?'✅ ganaste':(e.ganador?'❌ perdiste':'🤝 empate');
    return `<div class="duelo-row"><span>vs <b>${esc(otro?otro.alias:'?')}</b>${d.apuesta?` · ${esc(d.apuesta)}`:''}</span><span class="duelo-est">${estado}</span></div>`;
  }).join('')}</div>`;
}

// 🥊 Pantalla vertical de la boleta del duelo. Muestra "Gana [equipo]" / "Empate"
// en vez de 1/X/2, con ✓ en los aciertos. Mantiene el misterio hasta que arranca la fecha.
function vDueloBoleta(){
  const esPar=!!S.dueloPar;   // cruce del mundial (par ad-hoc) vs desafío guardado
  const volver=`<button class="btn alt" data-act="volver-duelos" style="margin-top:6px">← Volver</button>`;
  let deId,paraId,f,apuesta='',dObj=null,ctxEyebrow,ctxTitulo='🥊 Boleta del duelo';
  if(esPar){
    deId=S.dueloPar.deId; paraId=S.dueloPar.paraId; f=S.fechas.find(x=>x.id===S.dueloPar.fechaId);
    ctxEyebrow=S.dueloPar.eyebrow||'Mundial de duelos'; ctxTitulo=S.dueloPar.titulo||'🥊 Cruce del mundial';
  }else{
    dObj=S.desafios.find(x=>x.id===S.dueloBoletaId);
    if(!dObj)return `<div class="eyebrow">Duelo</div><div class="h1" style="margin-bottom:12px">🥊 Boleta del duelo</div><div class="card"><p class="muted" style="margin:0">No encontré el duelo (quizá lo eliminaron).</p></div>${volver}`;
    deId=dObj.deId; paraId=dObj.paraId; f=S.fechas.find(x=>x.id===dObj.fechaId); apuesta=dObj.apuesta||'';
  }
  if(!f)return `<div class="eyebrow">${esc(esPar?ctxEyebrow:'Duelo')}</div><div class="h1" style="margin-bottom:12px">${ctxTitulo}</div><div class="card"><p class="muted" style="margin:0">No encontré la fecha del ${esPar?'cruce':'duelo'}.</p></div>${volver}`;
  const bA=(S.boletas[f.id]||[]).find(b=>b.jugadorId===deId);
  const bB=(S.boletas[f.id]||[]).find(b=>b.jugadorId===paraId);
  const A=alias(deId), B=alias(paraId);
  const org=soyOrg();
  // Estado (ganador/pts) — misma lógica para duelo suelto y para cruce de mundial.
  let e;
  if(dObj){e=estadoDesafio(dObj);}
  else if(f.estado!=='finalizada'){e={fase:'en-juego'};}
  else{const c=mdCruce(S.mundial||{},deId,paraId,f,mdRankGeneral());e={fase:'terminado',pa:c.pa,pb:c.pb,ganador:c.ganador,motivo:c.motivo};}
  // 🔒 Los pronósticos recién se ven cuando la fecha ARRANCÓ (cerró o hay algún resultado).
  const arrancada=efEstado(f)!=='abierta'||f.partidos.some(p=>p.resultado);
  // Encabezado de estado
  let estCab, estCls='';
  const motTxt=e.motivo==='goles'?' · por goles 🎯':e.motivo==='tabla'?' · por tabla 📊':'';
  if(e.fase==='terminado'){
    if(e.ganador){estCab=`🏆 ${esPar?'Pasa':'Ganó'} ${esc(alias(e.ganador))} · ${e.pa} a ${e.pb}${motTxt}`;estCls='gana';}
    else{estCab=`🤝 Empataron · ${e.pa} a ${e.pb}`;}
  }else if(arrancada){estCab=esPar?'🔴 Cruce en juego':'🔴 Duelo en juego';estCls='vivo';}
  else{estCab='🔒 Pronósticos ocultos hasta que arranque la fecha';}
  // Qué dijo cada uno para un partido → texto "Gana X" / "Empate" (+ si acertó)
  const dijo=(b,p)=>{
    if(!arrancada)return {t:'🔒 oculto',ok:false,hid:true};
    if(!b||!b.picks||!b.picks[p.id])return {t:'— sin marcar',ok:false};
    const v=b.picks[p.id];
    const t=v==='L'?`Gana ${p.local}`:v==='V'?`Gana ${p.visitante}`:'Empate';
    const ok=!!p.resultado&&p.resultado!=='A'&&v===p.resultado;
    return {t,ok};
  };
  const cards=f.partidos.map(p=>{
    const pA=dijo(bA,p), pB=dijo(bB,p);
    const resTxt=p.resultado==='A'?'Suspendido':(p.resultado?pickTexto(p,p.resultado):null);
    return `<div class="db-match">
      <div class="db-teams">${escudo(p.local)}<span class="db-tn">${esc(p.local)}</span><span class="db-vs">vs</span><span class="db-tn">${esc(p.visitante)}</span>${escudo(p.visitante)}</div>
      ${resTxt?`<div class="db-res">Resultado: <b>${esc(resTxt)}</b></div>`:''}
      <div class="db-picks">
        <div class="db-pick ${pA.ok?'ok':''} ${pA.hid?'hid':''}"><span class="db-who">${esc(A)}</span><span class="db-say">${pA.ok?'✅ ':''}${esc(pA.t)}</span></div>
        <div class="db-pick ${pB.ok?'ok':''} ${pB.hid?'hid':''}"><span class="db-who">${esc(B)}</span><span class="db-say">${pB.ok?'✅ ':''}${esc(pB.t)}</span></div>
      </div>
    </div>`;
  }).join('');
  return `<div class="eyebrow">${esc(esPar?ctxEyebrow:('Duelo · '+f.nombre))}</div>
    <div class="h1" style="margin-bottom:12px">${ctxTitulo}</div>
    <div class="card db-head">
      <div class="db-vs-top"><span style="flex:1;text-align:right">${esc(A)}</span><span>🆚</span><span style="flex:1;text-align:left">${esc(B)}</span></div>
      ${apuesta?`<div class="db-apuesta">🎁 Se juegan: <b>${esc(apuesta)}</b></div>`:''}
      ${esPar?`<div class="db-apuesta">📅 ${esc(f.nombre)}</div>`:''}
      <div class="db-estado ${estCls}">${estCab}</div>
    </div>
    ${cards}
    ${volver}
    ${(org&&dObj)?`<button class="btn danger" data-duelo-anular="${dObj.id}" style="margin-top:8px">🗑️ Eliminar este duelo</button>`:''}`;
}

// 🏆 Pantalla del MUNDIAL DE DUELOS: la llave por pestañas (Octavos/Cuartos/Semi/Final).
function vMundial(){
  const volver=`<button class="btn alt" data-act="cerrar-mundial" style="margin-top:6px">← Volver</button>`;
  const br=mundialBracket();
  if(!br)return `<div class="eyebrow">Mundial</div><div class="h1" style="margin-bottom:12px">🏆 Mundial de duelos</div><div class="card"><p class="muted" style="margin:0">No hay un mundial activo en este momento.</p></div>${volver}`;
  const {seeds,listo,tam,rondas,campeon,m}=br;
  const fIni=S.fechas.find(x=>x.id===m.fechaInicioId);
  const org=soyOrg();
  const placa=campeon?`<div class="card md-champ">
      <div class="md-champ-k">🏆 CAMPEÓN DEL MUNDIAL</div>
      <div class="md-champ-n">${esc(alias(campeon))}</div>
      <div class="md-champ-s">Ganó todos los cruces. ¡Crack! 🔥</div>
      <button class="btn" data-act="compartir-mundial" style="margin-top:12px;background:#fff;color:#7c5a14">📤 Compartir al WhatsApp</button>
    </div>`:'';
  // Todavía no están los N (fecha de arranque abierta o faltan boletas pagas)
  if(!listo){
    const faltan=tam-seeds.length;
    return `<div class="eyebrow">Mundial de duelos</div>
      <div class="h1" style="margin-bottom:12px">🏆 Mundial de duelos</div>
      <div class="card md-head">
        <div class="md-head-t">Llenando la llave…</div>
        <div class="md-head-s">Entran los <b>primeros ${tam} con boleta paga</b> de <b>${fIni?esc(fIni.nombre):'la fecha de arranque'}</b>. Cuando cierre esa fecha se sortea la llave.</div>
        <div class="md-count">${seeds.length} / ${tam}${faltan>0?` · faltan ${faltan}`:''}</div>
      </div>
      ${seeds.length?`<div class="card"><div class="lbl" style="margin-bottom:8px">Anotados hasta ahora</div>${seeds.map((id,i)=>`<div class="md-seed"><span class="md-seed-n">${i+1}</span> ${esc(alias(id))}${id===S.yo?' · vos':''}</div>`).join('')}</div>`:`<div class="card"><p class="muted" style="margin:0">Todavía no hay boletas pagas en la fecha de arranque.</p></div>`}
      ${volver}`;
  }
  // Pestaña activa: por defecto la primera ronda no terminada (la "viva")
  let def=rondas.length-1;
  for(let r=0;r<rondas.length;r++){ if(!rondas[r].cruces.every(c=>c.resuelto)){def=r;break;} }
  const tab=(S.mdTab!=null&&S.mdTab>=0&&S.mdTab<rondas.length)?S.mdTab:def;
  const tabs=rondas.map((rd,i)=>`<button class="md-tab ${i===tab?'on':''}" data-md-tab="${i}">${rd.nombre}</button>`).join('');
  const rd=rondas[tab], fR=rd.fecha;

// 📊 Barra de progreso pegada abajo: se ve siempre, sin scrollear.
// Muestra cuántos partidos van marcados y deja confirmar desde donde estés.
function barraProgreso(f){
  const total=f.partidos.length;
  if(!total)return '';
  const hechos=f.partidos.filter(p=>S.misPicks[p.id]).length;
  const faltanP=total-hechos;
  const faltaTurbo=!!f.turbo&&!S.miTurbo;
  const faltaDes=!!f.desempate&&S.misDesempate==null;
  const listo=faltanP===0&&!faltaTurbo&&!faltaDes;
  const pct=Math.round((hechos/total)*100);
  let txt,btn;
  if(faltanP>0){ txt=`${hechos} de ${total} marcados`; btn=`Falta${faltanP>1?'n':''} ${faltanP}`; }
  else if(faltaTurbo){ txt='🏎️ Elegí tu Turbo'; btn='Falta el Turbo'; }
  else if(faltaDes){ txt='🎯 Poné tu desempate'; btn='Falta el desempate'; }
  else { txt=`✅ ${total} de ${total} · todo listo`; btn='Confirmar mi boleta'; }
  return `<div class="prog-bar ${listo?'listo':''}">
    <div class="prog-fill" style="width:${pct}%"></div>
    <div class="prog-in">
      <span class="prog-txt">${txt}</span>
      <button class="prog-btn" data-act="cargar" ${listo?'':'disabled'}>${btn}</button>
    </div>
  </div>`;
}

// 🗓️ Agrupa los partidos por DÍA (si el organizador cargó el día).
// Clave: se agrupa por el NOMBRE DEL DÍA, así "Sábado 17:00" y "Sábado 21:30"
// caen en el MISMO grupo (Sábado) y la hora se muestra en cada partido.
const DIAS_SEM=['miercoles','jueves','viernes','sabado','domingo','lunes','martes'];
function diaClave(txt){
  const n=normEq(txt||'');
  for(const d of DIAS_SEM){ if(n.includes(d)) return d; }
  return n;                                   // si no puso un día conocido, agrupa por el texto tal cual
}
function diaTitulo(txt){                      // "Sábado 21:30" → "Sábado"
  const t=(txt||'').trim();
  const m=t.match(/^\s*(\S+)/);
  const prim=m?m[1]:t;
  return DIAS_SEM.includes(normEq(prim))?prim:t;
}
function diaHora(txt){                        // "Sábado 21:30" → "21:30"  (lo que sobra del día)
  const t=(txt||'').trim();
  const m=t.match(/^\s*(\S+)\s+(.*)$/);
  if(m&&DIAS_SEM.includes(normEq(m[1])))return m[2].trim();
  return '';
}
function agruparPorDia(partidos){
  const grupos=[];const idx={};
  for(const p of partidos){
    const d=(p.dia||'').trim();
    const k=d?diaClave(d):'__sin__';
    if(idx[k]===undefined){idx[k]=grupos.length;grupos.push({dia:d?diaTitulo(d):'',items:[]});}
    grupos[idx[k]].items.push(p);
  }
  return grupos;
}
function partidosAgrupados(f){
  const grupos=agruparPorDia(f.partidos);
  const hayDias=grupos.some(g=>g.dia);
  if(!hayDias)return f.partidos.map(m=>matchRow(m,S.misPicks[m.id],!!f.turbo,S.miTurbo===m.id)).join('');
  return grupos.map(g=>{
    const n=g.items.length;
    const cab=g.dia
      ? `<div class="dia-cab"><span class="dia-nom">🗓️ ${esc(g.dia)}</span><span class="dia-n">${n} partido${n>1?'s':''}</span></div>`
      : `<div class="dia-cab otros"><span class="dia-nom">Otros partidos</span><span class="dia-n">${n}</span></div>`;
    return cab + g.items.map(m=>matchRow(m,S.misPicks[m.id],!!f.turbo,S.miTurbo===m.id)).join('');
  }).join('');
}
function matchRow(m,pick,turboOn,esTurbo){
  const opt=(o,cls,cap,nm)=>`<button class="opt ${cls} ${pick===o?'sel':''}" data-pick="${m.id}|${o}">${cap?`<span class="cap">${cap}</span>`:''}<span class="nm">${nm}</span></button>`;
  const hr=diaHora(m.dia);
  return `<div class="match2 ${esTurbo?'con-turbo':''}">
    ${hr?`<div class="m-hora">🕒 ${esc(hr)}</div>`:''}
    <div class="m-top"><div class="tm tm-l"><span>${esc(m.local)}</span>${escudo(m.local)}</div><span class="vs">vs</span><div class="tm tm-r">${escudo(m.visitante)}<span>${esc(m.visitante)}</span></div></div>
    <div class="pick3">${opt('L','loc','Gana',esc(m.local))}${opt('E','emp','','Empate')}${opt('V','res','Gana',esc(m.visitante))}</div>
    ${turboOn?`<button class="turbo-btn ${esTurbo?'on':''}" data-turbo="${m.id}" type="button">${esTurbo?'🏎️ TURBO ACTIVADO · vale doble':'🏎️ Poner el turbo acá'}</button>`:''}</div>`;
}

    <p class="note" style="margin-top:8px">💬 abre WhatsApp con esa persona. Bloquear: no puede entrar ni jugar más. Eliminar: lo borra del padrón y sus boletas.</p></div>`;

    <input class="field" id="newCargPin" type="text" autocapitalize="off" autocomplete="off" spellcheck="false" placeholder="${S.config.cargadorPin?'Cambiar a otro PIN':'PIN para el secretario (mín. 4)'}" maxlength="24">

// Agrupa también al cargar resultados: te ordena el trabajo del fin de semana.
function resAgrupados(f,getRes){
  const grupos=agruparPorDia(f.partidos);
  const hayDias=grupos.some(g=>g.dia);
  if(!hayDias)return f.partidos.map(m=>matchRowRes(m,getRes(m))).join('');
  return grupos.map(g=>{
    const n=g.items.length;
    const cab=g.dia?`<div class="dia-cab"><span class="dia-nom">🗓️ ${esc(g.dia)}</span><span class="dia-n">${n} partido${n>1?'s':''}</span></div>`
                   :`<div class="dia-cab otros"><span class="dia-nom">Otros partidos</span><span class="dia-n">${n}</span></div>`;
    return cab + g.items.map(m=>matchRowRes(m,getRes(m))).join('');
  }).join('');
}
function matchRowRes(m,res){
  if(res==='A')return `<div class="match2 anulado"><div class="m-top"><div class="tm tm-l"><span>${esc(m.local)}</span>${escudo(m.local)}</div><span class="vs">vs</span><div class="tm tm-r">${escudo(m.visitante)}<span>${esc(m.visitante)}</span></div></div><button class="anul-btn on" data-res="${m.id}|A">SUSPENDIDO ✕ · tocá para revertir</button></div>`;
  const opt=(o,cls,cap,nm)=>`<button class="opt ${cls} ${res===o?'sel':''}" data-res="${m.id}|${o}">${cap?`<span class="cap">${cap}</span>`:''}<span class="nm">${nm}</span></button>`;
  const hr=diaHora(m.dia);
  return `<div class="match2">
    ${hr?`<div class="m-hora">🕒 ${esc(hr)}</div>`:''}
    <div class="m-top"><div class="tm tm-l"><span>${esc(m.local)}</span>${escudo(m.local)}</div><span class="vs">vs</span><div class="tm tm-r">${escudo(m.visitante)}<span>${esc(m.visitante)}</span></div></div>
    <div class="pick3">${opt('L','loc','Ganó',esc(m.local))}${opt('E','emp','','Empate')}${opt('V','res','Ganó',esc(m.visitante))}</div>
    <button class="anul-btn" data-res="${m.id}|A" style="margin-top:7px">Partido suspendido · no cuenta</button></div>`;
}
function empty(i,t,p){return `<div class="empty"><div class="ei">${i}</div><div class="h1">${t}</div><p>${p}</p></div>`;}

/* ===== BOLETA PNG (ticket claro) ===== */
function bajarBoleta(b,f,ganadora){
  const ms=f.partidos;
  // Texto del pronóstico EN PALABRAS (no 1/X/2): "Gana Francia" / "Empate" / "Gana Marruecos"
  const pronTxt=(m,pk)=>pk==='E'?'Empate':pk==='L'?('Gana '+m.local):pk==='V'?('Gana '+m.visitante):'—';
  const gratis=esGratis()||(+f.precio===0&&f.precio!=null);const tNom=((torneoActual()&&torneoActual().nombre)||'PRODE').toUpperCase();
  const conDes=!!f.desempate&&b.desempate!=null;
  const W=740,padX=42,rowH=52,head=232,foot=150+(conDes?52:0),sc=2;
  const H=head+ms.length*rowH+foot;
  const cv=document.createElement('canvas');cv.width=W*sc;cv.height=H*sc;const x=cv.getContext('2d');x.scale(sc,sc);
  // fondo blanco
  x.fillStyle='#ffffff';x.fillRect(0,0,W,H);
  // dientes ticket arriba
  x.fillStyle='#eceff3';for(let i=0;i<W;i+=18){x.beginPath();x.arc(i+9,0,7,0,Math.PI);x.fill();}
  // header
  x.fillStyle='#15a34a';x.beginPath();x.arc(padX+14,58,15,0,7);x.fill();
  x.fillStyle='#fff';x.font='bold 16px sans-serif';x.textAlign='center';x.fillText('⚽',padX+14,63);x.textAlign='left';
  x.fillStyle='#0e1726';x.font='900 30px Archivo,sans-serif';x.fillText('PRODE',padX+38,58);
  x.fillStyle='#15a34a';x.font='700 12px sans-serif';x.fillText('CRC · '+tNom.slice(0,22),padX+38,74);
  x.fillStyle='#0e1726';x.font='700 13px "Space Mono",monospace';x.textAlign='right';x.fillText('BOLETA N°',W-padX,48);
  x.font='900 22px Archivo,sans-serif';x.fillText(b.id.toUpperCase(),W-padX,72);x.textAlign='left';
  // linea
  x.strokeStyle='#e4e9ef';x.lineWidth=1.5;x.beginPath();x.moveTo(padX,98);x.lineTo(W-padX,98);x.stroke();
  // jugador + fecha
  x.fillStyle='#8696a6';x.font='600 11px sans-serif';x.fillText('JUGADOR',padX,122);
  x.fillStyle='#0e1726';x.font='800 19px Archivo,sans-serif';x.fillText(alias(b.jugadorId),padX,146);
  x.fillStyle='#8696a6';x.font='600 11px sans-serif';x.textAlign='right';x.fillText('FECHA Y HORA',W-padX,122);
  x.fillStyle='#0e1726';x.font='600 14px sans-serif';x.fillText(new Date(b.ts).toLocaleString('es-AR',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}),W-padX,144);x.textAlign='left';
  // sub header nombre fecha + premio
  x.fillStyle='#f6f8fa';x.fillRect(padX,166,W-padX*2,38);
  x.fillStyle='#0e1726';x.font='800 15px Archivo,sans-serif';x.fillText(esc(f.nombre),padX+12,190);
  x.fillStyle='#15a34a';x.font='800 15px Archivo,sans-serif';x.textAlign='right';x.fillText(gratis?'🎟️ Gratis':(sinPremio(f)?'🎉 Por diversión':'Premio '+$(premioDe(f))),W-padX-12,190);x.textAlign='left';
  // encabezado tabla
  x.fillStyle='#8696a6';x.font='700 11px sans-serif';x.fillText('PARTIDO',padX,224);x.textAlign='right';x.fillText('PRONÓSTICO',W-padX,224);x.textAlign='left';
  let y=head;
  for(const m of ms){
    x.strokeStyle='#eef1f4';x.beginPath();x.moveTo(padX,y+rowH-8);x.lineTo(W-padX,y+rowH-8);x.stroke();
    const pk=b.picks[m.id];
    const txt=pronTxt(m,pk);
    // pastilla verde a la derecha, ancho según el texto
    x.font='800 15px Archivo,sans-serif';
    let tw=x.measureText(txt).width;
    const maxPill=330;
    let fs=15;
    while(tw+26>maxPill&&fs>10){fs-=1;x.font='800 '+fs+'px Archivo,sans-serif';tw=x.measureText(txt).width;}
    const pillW=Math.min(maxPill,tw+26),pillX=W-padX-pillW;
    x.fillStyle=pk?'#15a34a':'#c9d2dc';roundRect(x,pillX,y+6,pillW,34,17);x.fill();
    x.fillStyle='#fff';x.textAlign='center';x.fillText(txt,pillX+pillW/2,y+29);x.textAlign='left';
    // nombre del partido, recortado para no pisar la pastilla
    const dispo=pillX-padX-14;
    let nom=m.local+'  vs  '+m.visitante,nfs=15;
    x.font='600 '+nfs+'px sans-serif';
    while(x.measureText(nom).width>dispo&&nfs>10){nfs-=1;x.font='600 '+nfs+'px sans-serif';}
    if(x.measureText(nom).width>dispo){while(nom.length>4&&x.measureText(nom+'…').width>dispo)nom=nom.slice(0,-1);nom+='…';}
    x.fillStyle='#0e1726';x.fillText(nom,padX,y+29);
    y+=rowH;
  }
  // DESEMPATE del participante (solo si la fecha lo pide)
  if(conDes){
    x.fillStyle='#eef4ff';roundRect(x,padX,y+4,W-padX*2,40,10);x.fill();
    x.strokeStyle='#c7d8f5';x.lineWidth=1.5;roundRect(x,padX,y+4,W-padX*2,40,10);x.stroke();
    x.fillStyle='#1f3d7a';x.font='800 14px Archivo,sans-serif';
    x.fillText('🎯 Desempate · goles totales de la fecha',padX+12,y+29);
    x.font='900 18px Archivo,sans-serif';x.textAlign='right';x.fillText(String(b.desempate),W-padX-14,y+30);x.textAlign='left';
    y+=52;
  }
  // separador punteado
  x.strokeStyle='#cbd3dc';x.setLineDash([5,5]);x.beginPath();x.moveTo(padX,y+10);x.lineTo(W-padX,y+10);x.stroke();x.setLineDash([]);
  // total + sello
  x.fillStyle='#8696a6';x.font='700 11px sans-serif';x.fillText(gratis?'':'TOTAL',padX,y+36);
  x.fillStyle='#0e1726';x.font='900 26px Archivo,sans-serif';x.fillText(gratis?'🎟️ GRATIS':$(f.precio||PRECIO_DEF),padX,y+64);
  // sello
  const sx=W-padX-180,sy=y+22,col=gratis?'#15a34a':(b.pagada?'#15a34a':'#dd9b1f');
  x.strokeStyle=col;x.lineWidth=2.5;roundRect(x,sx,sy,180,46,10);x.stroke();
  x.fillStyle=col;x.font='800 15px Archivo,sans-serif';x.textAlign='center';
  x.fillText(gratis?'🎟️ PRÁCTICA':(b.pagada?'✓ PAGO CONFIRMADO':'PAGO PENDIENTE'),sx+90,sy+22);
  x.font='600 10px sans-serif';x.fillText(ganadora?'BOLETA GANADORA 🏆':(gratis?'Torneo gratis':(b.pagada&&b.pagadaTs?'Confirmado '+new Date(b.pagadaTs).toLocaleDateString('es-AR',{day:'2-digit',month:'2-digit'})+' '+new Date(b.pagadaTs).toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'}):'Prode CRC')),sx+90,sy+38);x.textAlign='left';
  // pie
  x.fillStyle='#15a34a';x.font='800 16px Archivo,sans-serif';x.textAlign='center';x.fillText('¡MUCHA SUERTE! ⚽',W/2,H-34);x.textAlign='left';
  // dientes abajo
  x.fillStyle='#eceff3';for(let i=0;i<W;i+=18){x.beginPath();x.arc(i+9,H,7,Math.PI,0);x.fill();}
  cv.toBlob(blob=>{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='boleta_'+alias(b.jugadorId)+'_'+b.id+'.png';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000);});
  toast('Boleta descargada 📥');
}
function roundRect(x,px,py,w,h,r){x.beginPath();x.moveTo(px+r,py);x.arcTo(px+w,py,px+w,py+h,r);x.arcTo(px+w,py+h,px,py+h,r);x.arcTo(px,py+h,px,py,r);x.arcTo(px,py,px+w,py,r);x.closePath();}

/* ===== COUNTDOWN ===== */
function startCountdown(){
  const f=fechaActiva();if(!f||!f.cierre||efEstado(f)!=='abierta'||S.view!=='jugar')return;
  const tick=()=>{const el=document.getElementById('cdv');if(!el){if(cdTimer)clearInterval(cdTimer);return;}
    const ms=f.cierre-Date.now();if(ms<=0){clearInterval(cdTimer);render();return;}
    const h=Math.floor(ms/3.6e6),m=Math.floor(ms%3.6e6/6e4),s=Math.floor(ms%6e4/1e3);
    el.textContent=String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
    const box=document.getElementById('cd');if(box)box.classList.toggle('urgent',ms<3.6e6);};
  tick();cdTimer=setInterval(tick,1000);
}

function refreshForm(){
  const f=fechaActiva();if(!f)return;
  document.querySelectorAll('[data-pick]').forEach(c=>{const[id,o]=c.dataset.pick.split('|');c.classList.toggle('sel',S.misPicks[id]===o);});
  const total=f.partidos.length;
  const hechos=f.partidos.filter(p=>S.misPicks[p.id]).length;
  const faltanP=total-hechos;
  const faltaTurbo=!!f.turbo&&!S.miTurbo;
  const faltaDes=!!f.desempate&&S.misDesempate==null;
  const listo=total>0&&faltanP===0&&!faltaTurbo&&!faltaDes;
  const mb=miBoleta(f.id);
  // texto del botón principal
  const txtBtn=faltanP>0?('Marcá los '+total+' partidos')
    :(faltaTurbo?'🏎️ Elegí dónde poner el turbo'
    :(faltaDes?'Poné tu desempate (goles)'
    :(mb?'Guardar cambios':'Confirmar mi boleta')));
  document.querySelectorAll('[data-act="cargar"]').forEach(b=>{
    b.disabled=!listo;
    if(!b.classList.contains('prog-btn'))b.textContent=txtBtn;
  });
  // barra de progreso (se actualiza sin re-dibujar la pantalla, no se pierde el scroll)
  const bar=document.querySelector('.prog-bar');
  if(bar){
    bar.classList.toggle('listo',listo);
    const fill=bar.querySelector('.prog-fill');
    if(fill)fill.style.width=(total?Math.round((hechos/total)*100):0)+'%';
    const t=bar.querySelector('.prog-txt');
    const pb=bar.querySelector('.prog-btn');
    if(faltanP>0){ if(t)t.textContent=`${hechos} de ${total} marcados`; if(pb)pb.textContent=`Falta${faltanP>1?'n':''} ${faltanP}`; }
    else if(faltaTurbo){ if(t)t.textContent='🏎️ Elegí tu Turbo'; if(pb)pb.textContent='Falta el Turbo'; }
    else if(faltaDes){ if(t)t.textContent='🎯 Poné tu desempate'; if(pb)pb.textContent='Falta el desempate'; }
    else { if(t)t.textContent=`✅ ${total} de ${total} · todo listo`; if(pb)pb.textContent=mb?'Guardar cambios':'Confirmar mi boleta'; }
  }
}

<!-- 📱 APP INSTALABLE: ícono en la pantalla del celu. No toca datos ni el juego. -->
<script>
(function(){
  var LS='pwaOculto';               // si la cerró, no molestamos por 15 días
  var bar=document.getElementById('pwaBar');
  var ios=document.getElementById('pwaIos');
  var btn=document.getElementById('pwaInstall');
  var cerrar=document.getElementById('pwaClose');
  var iosOk=document.getElementById('pwaIosOk');
  var deferred=null;

  function yaInstalada(){
    return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone===true;
  }
  function oculta(){
    try{var t=+localStorage.getItem(LS)||0;return (Date.now()-t) < 15*24*60*60*1000;}catch(e){return false;}
  }
  function esIOS(){
    return /iphone|ipad|ipod/i.test(navigator.userAgent) && !/crios|fxios/i.test(navigator.userAgent);
  }
  function mostrar(){ if(!yaInstalada() && !oculta()) bar.classList.add('on'); }
  function esconder(){ bar.classList.remove('on'); }

  // Android/Chrome: el navegador avisa cuando se puede instalar
  window.addEventListener('beforeinstallprompt', function(e){
    e.preventDefault(); deferred=e;
    setTimeout(mostrar, 2500);   // esperamos a que cargue la app, para no molestar de entrada
  });

  // iPhone: no hay botón automático → mostramos el instructivo
  if(esIOS()) setTimeout(mostrar, 2500);

  btn && (btn.onclick=function(){
    if(deferred){                       // Android: instalación real, un toque
      deferred.prompt();
      deferred.userChoice.then(function(r){
        if(r && r.outcome==='accepted') esconder();
        deferred=null;
      });
    }else if(esIOS()){                  // iPhone: mostramos los 3 pasos
      ios.classList.add('on');
    }else{
      esconder();
    }
  });
  cerrar && (cerrar.onclick=function(){ esconder(); try{localStorage.setItem(LS,Date.now());}catch(e){} });
  iosOk && (iosOk.onclick=function(){ ios.classList.remove('on'); esconder(); try{localStorage.setItem(LS,Date.now());}catch(e){} });

  window.addEventListener('appinstalled', function(){ esconder(); });

  // Service worker: necesario para que el celu ofrezca instalar.
  // OJO: NO cachea la app (así nadie se queda con una versión vieja tras una actualización).
  if('serviceWorker' in navigator){
    window.addEventListener('load', function(){
      navigator.serviceWorker.register('sw.js').catch(function(){});
    });
  }
})();
</script>
